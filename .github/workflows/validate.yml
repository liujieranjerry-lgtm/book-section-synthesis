name: validate

on:
  # PR 走 pull_request；只有合进 main 的提交再跑一次 push，避免同一分支上双跑。
  # tag 由 release workflow 负责，它自己会先跑同一套校验。
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs on purpose: a moved tag cannot change
      # what runs here. The scripts themselves use the standard library only, so
      # this job installs nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: 结构与版本一致性
        run: python3 scripts/validate.py .
      - name: 链接与锚点
        run: python3 scripts/check_links.py .
